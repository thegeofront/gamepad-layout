<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gamepad Layout Generator - By FEENSTER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <link rel="icon" type="image/svg+xml" href="./assets/logo.svg">
  <meta name="description" content="Gamepad Layout Generator - By FEENSTER">
  <meta name="keywords"
    content="Gamepad Layout Generator, FEENSTER, Gamepad, Layout, Generator, Controller, Xbox, Games, Custom, Layout, Design, Export, PNG">
  <meta name="author" content="Jos Feenstra">

  <meta property="og:title" content="Gamepad Layout Generator - By FEENSTER">
  <meta property="og:image" content="https://feenster.nl/assets/gamepad-layout.png">
  <meta property="og:description" content="Gamepad Layout Generator - By FEENSTER">
  <meta property="og:url" content="https://geofront.nl/gamepad-layout/">

</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Gamepad<br>Layout</h1>
        <span class="badge">Generator</span>
      </div>

      <div class="tools-section">
        <div class="tool-row">
          <label for="color-picker">Theme</label>
          <div class="color-picker-wrap">
            <input type="color" id="color-picker" value="#00ffc8">
            <span class="color-hex" id="color-hex">#00ffc8</span>
          </div>
        </div>

        <div class="tool-row">
          <label for="device-select">Device</label>
          <select id="device-select" class="tool-select">
            <option value="xbox">Xbox Controller</option>
            <option value="ps5">PS5 Controller</option>
            <option value="keyboard_mouse">Keyboard &amp; Mouse</option>
          </select>
        </div>

        <div class="tool-row">
          <label for="config-select">Config</label>
          <div class="config-controls">
            <select id="config-select"></select>
            <button class="icon-btn" id="add-config" title="Duplicate config">+</button>
            <button class="icon-btn danger" id="del-config" title="Delete config">&times;</button>
          </div>
        </div>

        <div class="tool-row">
          <label for="config-name">Name</label>
          <input type="text" id="config-name" class="tool-input" placeholder="Config name">
        </div>

        <div class="tool-row file-row">
          <button class="file-btn" id="save-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" y1="15" x2="12" y2="3" />
            </svg>
            Save JSON
          </button>
          <button class="file-btn" id="load-btn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            Load JSON
          </button>
          <input type="file" id="file-input" accept=".json" hidden>
        </div>

        <p class="tool-hint">Drag anchor dots or labels to reposition. Labels snap to slots.</p>
      </div>

      <div class="sidebar-content" id="button-list"></div>

      <div class="sidebar-footer">
        <button class="download-btn" id="download-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
            <polyline points="7 10 12 15 17 10" />
            <line x1="12" y1="15" x2="12" y2="3" />
          </svg>
          Download PNG
        </button>
        <div class="credits">
          <a href="https://geofront.nl" target="_blank" rel="noopener">
            <img class="credits-logo" src="assets/logo.svg" alt="GeoFront logo">
          </a>
          <span>Vibed by <a href="https://x.com/i_am_feenster" target="_blank" rel="noopener">FEENSTER</a></span>
          <div class="credits-avatar">
            <img src="assets/my-face.png" alt="FEENSTER">
          </div>
        </div>
      </div>
    </aside>

    <main class="canvas-area">
      <canvas id="canvas"></canvas>
    </main>
  </div>
  <script src="app.js"></script>
</body>

</html>
